name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      signing_check_only:
        description: 'Only validate signing secrets; do not build or publish'
        required: false
        default: true
        type: boolean
      run_layout_gate:
        description: 'Run the optional rendered layout gates (currently paused by project policy)'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  signing-check:
    if: github.event_name == 'workflow_dispatch' && inputs.signing_check_only
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Validate release signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: python3 scripts/ci/setup_signing.py
      - name: Remove signing files
        if: always()
        run: |
          rm -f app/keystore.properties
          rm -rf "$RUNNER_TEMP/cyime-signing"

  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.signing_check_only
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check release tag against source version
        if: github.event_name == 'push'
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Release tag must match versionName in app/build.gradle.kts"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Validate and configure release signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: python3 scripts/ci/setup_signing.py

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK
        run: |
          sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Cache native deps
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jni/onnxruntime
            app/src/main/jniLibs/**/libonnxruntime.so
          key: native-${{ runner.os }}-${{ hashFiles('app/build-logic/tasks-native.gradle.kts') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Download native deps (ONNX Runtime)
        run: ./gradlew downloadOnnx --no-daemon

      - name: Cache CMake build
        uses: actions/cache@v6
        with:
          path: |
            app/.cxx
            app/src/main/jni/boost
            app/src/main/jni/boost-*.tar.xz
          key: cmake-${{ runner.os }}-${{ hashFiles('app/src/main/jni/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile instrumented tests before starting the emulator
        if: inputs.run_layout_gate
        run: ./gradlew :app:compileDebugAndroidTestKotlin --no-daemon --max-workers=2

      - name: Enable emulator acceleration
        if: inputs.run_layout_gate
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rendered layout gate
        if: inputs.run_layout_gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_3a
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.kingzcheung.xime.ui.LayoutGeometryGateTest,com.kingzcheung.xime.ui.PanelLayoutAuditTest,com.kingzcheung.xime.ui.ExpandedCandidateLayoutTest,com.kingzcheung.xime.ui.OfflineEditionTest,com.kingzcheung.xime.ui.VisualStyleIntegrationTest,com.kingzcheung.xime.ui.IconAppearanceTest --no-daemon

      - name: Keep layout gate reports
        if: always() && inputs.run_layout_gate
        uses: actions/upload-artifact@v7
        with:
          name: release-layout-gate
          path: app/build/outputs/androidTest-results/connected/

      - name: Build Release APKs (Signed)
        run: |
          ./gradlew assembleRelease --no-daemon
          mkdir -p app/build/outputs/apk/distribution
          cp app/build/outputs/apk/release/CyIME-*.apk app/build/outputs/apk/distribution/

      - name: Offline edition layout gate
        if: inputs.run_layout_gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_3a
          script: ./gradlew :app:connectedDebugAndroidTest -PbundleModels=true -PpythonExecutable=python3 -Pandroid.testInstrumentationRunnerArguments.class=com.kingzcheung.xime.ui.LayoutGeometryGateTest,com.kingzcheung.xime.ui.PanelLayoutAuditTest,com.kingzcheung.xime.ui.ExpandedCandidateLayoutTest,com.kingzcheung.xime.ui.OfflineEditionTest,com.kingzcheung.xime.ui.VisualStyleIntegrationTest,com.kingzcheung.xime.ui.IconAppearanceTest --no-daemon

      - name: Build offline Release APKs
        run: |
          ./gradlew assembleRelease -PbundleModels=true -PpythonExecutable=python3 --no-daemon
          cp app/build/outputs/apk/release/CyIME-*-full-*.apk app/build/outputs/apk/distribution/

      - name: Build Plugin XIPKs (Unsigned)
        run: bash scripts/build-plugins.sh

      - name: Verify APK signatures
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/distribution/CyIME-*.apk; do
            OUT=$("$APKSIGNER" verify --verbose --min-sdk-version 23 --print-certs "$apk")
            # vivo OriginOS rejects APKs without a v1 (JAR) signature as 「安装包缺乏开发者证书」.
            # --min-sdk-version 23: for minSdk >= 24 apksigner skips v1 and always reports it false.
            echo "$OUT" | grep -q 'Verified using v1 scheme (JAR signing): true'
            echo "$OUT" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
            echo "Verified: $apk"
          done

      - name: Get version from tag
        if: github.event_name == 'push'
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: CyIME ${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: false
          files: |
            app/build/outputs/apk/distribution/CyIME-*.apk
            build/plugin-release/*.xipk
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep signed APKs and plugins for manual validation
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: signed-release-apks
          path: |
            app/build/outputs/apk/distribution/*.apk
            build/plugin-release/*.xipk
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing files
        if: always()
        run: |
          rm -f app/keystore.properties
          rm -rf "$RUNNER_TEMP/cyime-signing"
